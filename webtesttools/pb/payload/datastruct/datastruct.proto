syntax = "proto3";

package datastruct;



message mappoint{
    int32 x = 1;
    int32 y = 2;
}

message block  {
	repeated mappoint p=1 ;
    int32 l=2;
    int32 w=3;
    bytes dir=4;
}

message tank{
    uint32 x=1;
    uint32 y=2;
    uint32 reload=3;
    bool trigger=4;
    bytes GunFacing=5;
    bytes status=6;
    bytes orientation=7;
    string username=8;
    int32 point=9;
}

